<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADE - Agentic Development Environment</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="logo">
      <strong>ADE Core</strong> <span class="badge">Orchestrator</span>
    </div>
    
    <div class="actions">
      <button id="btn-add-term" class="btn primary">+ Novo Terminal</button>
      <div class="prompt-bar">
        <input type="text" id="global-prompt-input" placeholder="Comando rápido (ex: dir, git status, ou prompt de IA)..." />
        <select id="target-terminal-select">
          <option value="all">Todos os Terminais</option>
        </select>
        <button id="btn-send-prompt" class="btn">Disparar</button>
      </div>
    </div>
    <div class="stats" id="term-counter">0 terminais ativos</div>
  </header>

  <main id="terminals-grid" class="grid-container">
    <!-- Painéis de terminais criados dinamicamente via app.js -->
  </main>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
